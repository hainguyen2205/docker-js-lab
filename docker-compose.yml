services:

  mongodb:
    image: mongo:8.0
    container_name: sendly-mongodb
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
        MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
        MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    ports:
        - "${MONGO_PORT}:27017"
    volumes:
        - ./mongodb/data:/data/db

